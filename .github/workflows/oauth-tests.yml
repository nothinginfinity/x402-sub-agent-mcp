name: OAuth hardening tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - agent/oauth-hardening
    paths:
      - worker.js
      - package.json
      - tests/**
      - .github/workflows/oauth-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: OAuth integration tests
        id: oauth_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:oauth 2>&1 | tee oauth-test-output.txt

      - name: Publish OAuth test diagnostics
        if: steps.oauth_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oauth-test-output
          path: oauth-test-output.txt

      - name: Fail after diagnostics
        if: steps.oauth_tests.outcome == 'failure'
        run: exit 1

      - name: Full regression suite
        run: npm test
