name: OAuth hardening tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - agent/oauth-hardening
    paths:
      - worker.js
      - package.json
      - tests/**
      - .github/workflows/oauth-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: OAuth integration tests
        run: npm run test:oauth

      - name: Full regression suite
        run: npm test
